<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>YieGo — Your Everyday Digital Plug</title>
    <meta name="description" content="YieGo — data, airtime, bills, payments and 20+ digital services from one wallet." />
    <meta name="theme-color" content="#f2f7f4" />
    <script>
      // Apply the saved theme before first paint (no flash of wrong theme).
      // Daylight is the default; Onyx Dark when chosen (or via device setting).
      (function () {
        try {
          var t = localStorage.getItem("yiego_theme_v1");
          var dark =
            t === "dark" ||
            (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (!dark) {
            document.documentElement.classList.add("light");
          } else {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#080b0a");
          }
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
