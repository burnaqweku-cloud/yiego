      (function() {
        try {
          var stored = localStorage.getItem('yiego_theme');
          var theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {

        } catch(e) {
