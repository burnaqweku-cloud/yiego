    <!-- Social share cards. Scrapers (WhatsApp, Facebook, Twitter) read these
         without running JS, so every shared link gets a branded card. The Seo
         component overrides title/description/canonical per route at runtime. -->
    <meta property="og:site_name" content="DataYego" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DataYego · Buy Cheap MTN, Telecel & AirtelTigo Data Bundles in Ghana" />
    <meta property="og:description" content="Data bundles for every Ghana network. Pay with MoMo or card, every order tracked." />

    <meta property="og:image" content="https://datayego.com/brand/yiego-og-1200x630.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DataYego · Buy Cheap MTN, Telecel & AirtelTigo Data Bundles in Ghana" />
    <meta name="twitter:image" content="https://datayego.com/brand/yiego-og-1200x630.png" />
    <meta name="theme-color" content="#f2f7f4" />
    <script>
      // Apply the saved theme before first paint (no flash of wrong theme).
      // Daylight is the default; Onyx Dark when chosen (or via device setting).
      (function () {
        try {
          // The public site is always dark (src/store/theme.tsx → isPublicSitePath); dashboards and store hosts
          // follow the saved theme.
          var h = location.hostname.toLowerCase();
          var mainHost = ["datayego.com", "www.datayego.com", "yiego.shop", "www.yiego.shop", "localhost", "127.0.0.1"].indexOf(h) !== -1 || /\.(lovable\.app|lovableproject\.com|lovable\.dev)$/.test(h);
          var publicSite = mainHost && !/^\/(agent|admin)(\/|$)/.test(location.pathname);
          var t = localStorage.getItem("yiego_theme_v1");
          var dark =
            publicSite ||
            t === "dark" ||
            (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (!dark) {
            document.documentElement.classList.add("light");
          } else {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#080b0a");
          }
        } catch (e) {
          /* storage blocked: keep the public site dark, light elsewhere */
          if (!/^\/(agent|admin)(\/|$)/.test(location.pathname)) {
            var m2 = document.querySelector('meta[name="theme-color"]');
            if (m2) m2.setAttribute("content", "#080b0a");
          } else document.documentElement.classList.add("light");
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Fonts are self-hosted (main.tsx imports them): no third-party request before first paint. -->
  </head>

  </body>
