<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DataYego — Buy Cheap MTN, Telecel & AirtelTigo Data Bundles in Ghana</title>
    <meta name="description" content="Buy data bundles online in Ghana. Cheap MTN, Telecel and AirtelTigo bundles delivered to any number in minutes — pay with Mobile Money or card, no account needed." />
    <meta name="google-site-verification" content="jPwXRlqJNcOv5TsYJix9n-YHrurv6ll9CErP_5rKDd8" />
    <meta name="google-site-verification" content="Mch8pSDYNV_ZObJjp2MBu6lUFOexmKMucoU3qnvI6oE" />
    <!-- Social share cards. Scrapers (WhatsApp, Facebook, Twitter) read these
         without running JS, so every shared link gets a branded card. The Seo
         component overrides title/description/canonical per route at runtime. -->
    <meta property="og:site_name" content="DataYego" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DataYego — Buy Cheap MTN, Telecel & AirtelTigo Data Bundles in Ghana" />
    <meta property="og:description" content="Data bundles for every Ghana network, delivered in minutes. Pay with MoMo or card." />
    <meta property="og:url" content="https://datayego.com/" />
    <meta property="og:image" content="https://datayego.com/brand/yiego-og-1200x630.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DataYego — Buy Cheap MTN, Telecel & AirtelTigo Data Bundles in Ghana" />
    <meta name="twitter:image" content="https://datayego.com/brand/yiego-og-1200x630.png" />
    <meta name="theme-color" content="#f2f7f4" />
    <script>
      // Apply the saved theme before first paint (no flash of wrong theme).
      // Daylight is the default; Onyx Dark when chosen (or via device setting).
      (function () {
        try {
          var t = localStorage.getItem("yiego_theme_v1");
          var dark =
            t === "dark" ||
            (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (!dark) {
            document.documentElement.classList.add("light");
          } else {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#080b0a");
          }
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the families the stylesheet actually uses: Manrope (body),
         Space Grotesk (display), IBM Plex Mono (numbers/refs). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
